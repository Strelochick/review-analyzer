<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ReviewLab — анализ отзывов</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f4f6fb; color: #1f2937; }
  header { background: #1e293b; color: #fff; padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 22px; } header h1 span { color: #38bdf8; }
  header small { color: #94a3b8; }
  nav { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 40px; display: flex; }
  nav a { padding: 14px 18px; color: #475569; text-decoration: none; border-bottom: 3px solid transparent; }
  nav a.active, nav a:hover { color: #0284c7; border-color: #0284c7; }
  main { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
  .grid { display: grid; gap: 20px; }
  .g2 { grid-template-columns: 3fr 2fr; } .g3 { grid-template-columns: repeat(3, 1fr); } .g2e { grid-template-columns: 1fr 1fr; }
  .card { background: #fff; border-radius: 14px; padding: 20px 22px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
  .card h2 { margin: 0 0 14px; font-size: 18px; }
  .kpi { font-size: 30px; font-weight: 700; color: #0f172a; } .kpi-label { color: #64748b; font-size: 13px; }
  textarea, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
  .row { display: flex; gap: 10px; margin: 10px 0; }
  button { background: #0284c7; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; font-size: 15px; cursor: pointer; }
  button.secondary { background: #e2e8f0; color: #0f172a; }
  .result { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 16px; }
  .pos { background: #dcfce7; color: #166534; } .neg { background: #fee2e2; color: #991b1b; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; background: #f1f5f9; padding: 9px; color: #334155; }
  td { padding: 9px; border-bottom: 1px solid #f1f5f9; }
  img.chart { width: 100%; border-radius: 8px; }
  .rec { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
  .score { background: #e0f2fe; color: #075985; border-radius: 20px; padding: 2px 10px; font-weight: 600; }
  .muted { color: #64748b; font-size: 13px; }
  .bar { background: #e2e8f0; border-radius: 6px; height: 10px; width: 140px; display: inline-block; }
  .bar span { display: block; height: 100%; border-radius: 6px; background: #22c55e; }
  .best { background: #ecfdf5; font-weight: 600; }
  .users a { display: inline-block; margin: 2px; padding: 2px 8px; background: #f1f5f9; border-radius: 6px; color: #334155; text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
<header><h1>Review<span>Lab</span> — анализ отзывов</h1><small>ваш ID: {{ g.user_id }}</small></header>
<nav>
  <a href="/" class="{{ 'active' if page == 'index' }}">Главная</a>
  <a href="/products" class="{{ 'active' if page == 'products' }}">Статистика по товарам</a>
  <a href="/models" class="{{ 'active' if page == 'models' }}">Сравнение моделей</a>
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
